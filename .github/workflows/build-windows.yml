name: Windows Build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure tests
        run: cmake -S tests -B build-tests

      - name: Build tests
        run: cmake --build build-tests --config Release

      - name: Run tests
        run: ctest --test-dir build-tests -C Release --output-on-failure

  build:
    # The OBS plugin template currently configures the VS 2022 generator.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build plugin
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration RelWithDebInfo

      - name: Package plugin
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Configuration RelWithDebInfo

      - name: Validate single-extraction artifact layout
        shell: pwsh
        run: ./scripts/validate-artifact-layout.ps1 -Path release/RelWithDebInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: obs-virtual-camera-delay-windows-x64
          # GitHub Actions wraps every artifact in a ZIP. Upload the staged
          # plugin tree instead of the release ZIP so users only extract once.
          path: release/RelWithDebInfo
          if-no-files-found: error
